name: Site checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: node --test docs/tests/*.test.mjs
      - run: python3 -m unittest discover -s ops -p 'test_*.py' -v
