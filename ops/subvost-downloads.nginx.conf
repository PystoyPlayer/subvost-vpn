server {
    listen 80;
    server_name download.subvost.fun;
    location ^~ /.well-known/acme-challenge/ { root /var/www/subvost-download-acme; }
    location / { return 301 https://download.subvost.fun$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name download.subvost.fun;
    ssl_certificate /etc/nginx/ssl/subvost-download/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/subvost-download/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /var/www/subvost-downloads;
    index index.html;
    autoindex off;
    types { text/javascript mjs; text/html html; text/css css; application/json json; image/png png; image/svg+xml svg; }
    default_type application/octet-stream;
    access_log /var/log/nginx/subvost-download-access.log combined buffer=64k flush=10s;
    error_log /var/log/nginx/subvost-download-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location ~ /\. { return 404; }
    location ^~ /releases/ {
        try_files $uri =404;
        sendfile on;
        sendfile_max_chunk 1m;
        max_ranges 1;
        gzip off;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Disposition attachment;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag";
    }
    location / { try_files $uri $uri/ =404; }
}
